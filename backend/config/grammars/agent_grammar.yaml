# ════════════════════════════════════════════════════════════════════════
#  ACTION — ACTION TYPES (what the alert makes happen)
# ════════════════════════════════════════════════════════════════════════
- grammar_kind: action
  token_kind: action_type
  token: place_order
  value_type: void
  description: Place a new broker order with the supplied parameters.
  resolver: null
  params_schema:
    account:
      type: string
      required: true
      token_ref_ok: true
      description: Masked account id to route the order to (e.g. ZG####).
    symbol:
      type: string
      required: true
      description: Tradingsymbol, e.g. NIFTY26APR22500CE or RELIANCE.
    exchange:
      type: enum
      enum:
      - NSE
      - BSE
      - NFO
      - CDS
      - MCX
      required: false
      default: NFO
    side:
      type: enum
      enum:
      - BUY
      - SELL
      required: true
      description: BUY opens long / covers short; SELL opens short / closes long.
    # qty/order_type/price/trigger_price/product/variety/tag: type/enum/
    # description now sourced from backend/config/grammars/order_fields.yaml
    # (Phase 2 of the order/agent grammar unification — the shared catalog
    # the frontend CLI's buy/sell grammar also draws these concepts from).
    # required/default/token_ref_ok stay local — they're place_order's own
    # context, not part of the shared concept. Resolved at import time by
    # backend/api/algo/grammar.py's `_resolve_param_spec()`.
    qty:
      $ref: qty
      required: true
      token_ref_ok: true
    order_type:
      $ref: order_type
      required: false
      default: MARKET
    price:
      $ref: price
      required: false
      token_ref_ok: true
      # Sprint 17 — conditional requirement: real behavior is "required
      # when order_type is LIMIT or SL", not unconditionally optional.
      # Exact [LIMIT, SL] list confirmed from order_fields.yaml's own
      # `price` description ("Required for LIMIT / SL"). Local to this
      # token's params_schema per order_fields.yaml's own header comment
      # (required/default/token_ref_ok — and by the same reasoning,
      # conditional-requirement rules — are context-local, not shared
      # catalog concepts).
      required_if: {field: order_type, in: [LIMIT, SL]}
    trigger_price:
      $ref: trigger_price
      required: false
      token_ref_ok: true
      # Sprint 17 — exact [SL, SL-M] list confirmed from order_fields.yaml's
      # own `trigger_price` description ("Required for SL / SL-M"). See
      # `price` field's comment above for why this stays local.
      required_if: {field: order_type, in: [SL, SL-M]}
    product:
      $ref: product
      required: false
      default: MIS
    variety:
      $ref: variety
      required: false
      default: regular
    tag:
      $ref: tag
      required: false
    # Chase aggressiveness for the live chase engine (Phase 2 addition —
    # place_order had no documented way to set this before; the live
    # handler already threaded an undocumented `chase_aggressiveness`
    # param through to `_live_chase_config()` — see
    # backend/api/algo/actions_live.py:_action_place_order). `chase_level`
    # is the new canonical param name; absent, it still falls back to
    # `chase_aggressiveness` for any pre-existing agent, then to "med" —
    # zero behavior change for every agent that doesn't set either.
    chase_level:
      $ref: chase_level
      required: false
    # ── Template attachment (v2.1+) ─────────────────────────────
    # When set, the unified template-attach pipeline runs after
    # the parent order persists. TP / SL → broker GTT (or sim
    # SimGttBook); Wing → spread basket leg for SELL options.
    # Picking template_slug="none" or leaving everything null
    # places the entry without any follow-on attachments.
    template_id:
      type: number
      required: false
      description: OrderTemplate row id. Mutually exclusive with template_slug.
    template_slug:
      type: string
      required: false
      description: OrderTemplate stable slug (e.g. "default-bull", "default-short-vol", "none").
    tp_pct_override:
      type: number
      required: false
      description: Per-action TP% override (e.g. 25.0 = +25%). Wins over template default.
    sl_pct_override:
      type: number
      required: false
      description: Per-action SL% override (e.g. 15.0 = -15%). Wins over template default.
    wing_premium_pct_override:
      type: number
      required: false
      description: Per-action wing premium % override (sell_option only).
    wing_strike_offset_override:
      type: number
      required: false
      description: Per-action wing strike offset override (e.g. 500 → wing at +500 strike).
  # Sprint 17 — token-level (sibling of params_schema, not a per-field key)
  # declared mutual-exclusion. Served to the frontend from the in-memory
  # SYSTEM_TOKENS catalog (backend/api/algo/grammar.py:get_action_mutex_groups),
  # NOT round-tripped through the grammar_tokens DB table/GrammarToken model
  # (which has no column for this) — same "code-reviewed YAML catalog is
  # the trust boundary" pattern already used for params_schema's
  # token_ref_ok (see grammar.py's _ACTION_PARAMS_SCHEMAS comment).
  mutually_exclusive_groups:
    - [wing_premium_pct_override, wing_strike_offset_override]
# order/place_order unification, Phase A (2026-10) — "order" is a NEW
# catalog row, byte-identical in shape to "place_order" above (same
# grammar_kind/token_kind/resolver/params_schema/mutually_exclusive_groups),
# duplicated rather than renamed so BOTH tokens resolve/validate
# identically. "order" is the name the frontend CLI compiler emits going
# forward; "place_order" (above) stays in the catalog unchanged —
# dropping it is Phase B, explicitly deferred. Backend dispatch
# (actions.py: BROKER_ACTIONS / _LIVE_ACTION_HANDLERS) already routes
# both names to the exact same `_action_place_order` handler.
- grammar_kind: action
  token_kind: action_type
  token: order
  value_type: void
  description: Place a new broker order with the supplied parameters.
  resolver: null
  params_schema:
    account:
      type: string
      required: true
      token_ref_ok: true
      description: Masked account id to route the order to (e.g. ZG####).
    symbol:
      type: string
      required: true
      description: Tradingsymbol, e.g. NIFTY26APR22500CE or RELIANCE.
    exchange:
      type: enum
      enum:
      - NSE
      - BSE
      - NFO
      - CDS
      - MCX
      required: false
      default: NFO
    side:
      type: enum
      enum:
      - BUY
      - SELL
      required: true
      description: BUY opens long / covers short; SELL opens short / closes long.
    qty:
      $ref: qty
      required: true
      token_ref_ok: true
    order_type:
      $ref: order_type
      required: false
      default: MARKET
    price:
      $ref: price
      required: false
      token_ref_ok: true
      required_if: {field: order_type, in: [LIMIT, SL]}
    trigger_price:
      $ref: trigger_price
      required: false
      token_ref_ok: true
      required_if: {field: order_type, in: [SL, SL-M]}
    product:
      $ref: product
      required: false
      default: MIS
    variety:
      $ref: variety
      required: false
      default: regular
    tag:
      $ref: tag
      required: false
    chase_level:
      $ref: chase_level
      required: false
    template_id:
      type: number
      required: false
      description: OrderTemplate row id. Mutually exclusive with template_slug.
    template_slug:
      type: string
      required: false
      description: OrderTemplate stable slug (e.g. "default-bull", "default-short-vol", "none").
    tp_pct_override:
      type: number
      required: false
      description: Per-action TP% override (e.g. 25.0 = +25%). Wins over template default.
    sl_pct_override:
      type: number
      required: false
      description: Per-action SL% override (e.g. 15.0 = -15%). Wins over template default.
    wing_premium_pct_override:
      type: number
      required: false
      description: Per-action wing premium % override (sell_option only).
    wing_strike_offset_override:
      type: number
      required: false
      description: Per-action wing strike offset override (e.g. 500 → wing at +500 strike).
  mutually_exclusive_groups:
    - [wing_premium_pct_override, wing_strike_offset_override]
- grammar_kind: action
  token_kind: action_type
  token: modify_order
  value_type: void
  description: Modify an existing open broker order by broker_order_id.
  resolver: null
  params_schema:
    account:
      type: string
      required: true
    broker_order_id:
      type: string
      required: true
    new_price:
      type: number
      required: false
      token_ref_ok: true
    new_qty:
      type: number
      required: false
      token_ref_ok: true
    new_trigger:
      type: number
      required: false
      token_ref_ok: true
- grammar_kind: action
  token_kind: action_type
  token: cancel_order
  value_type: void
  description: Cancel a specific open broker order by broker_order_id.
  resolver: null
  params_schema:
    account:
      type: string
      required: true
    broker_order_id:
      type: string
      required: true
    variety:
      type: enum
      enum:
      - regular
      - amo
      - co
      - iceberg
      - auction
      required: false
      default: regular
- grammar_kind: action
  token_kind: action_type
  token: cancel_all_orders
  value_type: void
  description: Cancel every pending/open order matching the scope filter.
  resolver: null
  params_schema:
    scope:
      type: enum
      enum:
      - total
      - account
      default: total
    account:
      type: string
      required: false
      description: Required when scope=account.
    side:
      type: enum
      enum:
      - BUY
      - SELL
      required: false
    symbol:
      type: string
      required: false
      description: If set, cancel only orders on this tradingsymbol.
- grammar_kind: action
  token_kind: action_type
  token: chase_close_positions
  value_type: void
  description: Close every open position in scope using the adaptive limit-order chase engine.
  resolver: null
  params_schema:
    scope:
      type: enum
      enum:
      - total
      - account
      default: total
    account:
      type: string
      required: false
    timeout_minutes:
      type: number
      default: 10
      description: Bail out if not filled within this many minutes.
    adjust_pct:
      type: number
      default: 0.1
      description: Percent of spread to adjust on each chase step.

# Expiry-day surgical close. Unlike chase_close_positions (which
# closes everything in scope), this wraps the legacy ExpiryEngine
# so it APPLIES THE SAME RULES THE BG TASK USES — NFO closes all
# ITM + NTM; MCX closes only UNHEDGED ITM/NTM. The exchange param
# narrows the scan to ONE segment so the equity (15:00 IST) and
# commodity (23:00 IST) agents don't step on each other.
- grammar_kind: action
  token_kind: action_type
  token: expiry_auto_close
  value_type: void
  description: Run ExpiryEngine scan + close, restricted to ONE exchange. NFO closes all ITM/NTM; MCX
    closes only unhedged ITM/NTM (CE/PE pairs that net to zero are skipped). Used by the expiry-day auto-close
    agents.
  resolver: null
  params_schema:
    exchange:
      type: enum
      enum:
      - NFO
      - MCX
      required: true
      description: Restrict scan + close to this exchange.

# Simpler one-shot close of a specific position — LIMIT order at the
# instrument's current LTP. Side is derived from position direction
# (long → SELL to flatten, short → BUY to cover); operators can still
# override via `side`. In the simulator, the order is paper-traded:
# an AlgoOrder row is written with mode='sim' and initial_price = LTP
# at the moment the agent fired, so operators can see exactly what
# price the engine would have used.
- grammar_kind: action
  token_kind: action_type
  token: close_position
  value_type: void
  description: Close a single open position with a LIMIT order at current LTP. In sim mode, records a
    paper AlgoOrder with the sim's current LTP so the trade price is visible in order logs.
  resolver: null
  params_schema:
    account:
      type: string
      required: true
