  description: Write a message to the app log, with optional alert-routing metadata
    for any downstream event agent that matches it.
  resolver: backend.api.algo.actions.emit_log
  params_schema:
    level:
      type: enum
      enum:
      - info
      - warning
      - error
      - critical
