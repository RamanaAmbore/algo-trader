# ════════════════════════════════════════════════════════════════════════
#  EVENT AGENTS — RENDER ACTION (kind='event' agents only)
# ════════════════════════════════════════════════════════════════════════
# A kind='event' agent's `actions` array is always exactly one
# `{"type": "render", "render": "<renderer-key>", ...}` entry — a
# structurally different, flat shape from the `{"type": <action_type>,
# "params": {...}}` dispatchable actions above (which belong to
# kind='cycle' agents and resolve through actions.py's live dispatch
# tables). `render`'s own value is free text validated against
# `event_agents.RENDERS` by `event_agents.validate_seed_spec()`, NOT
# against this catalog. This section exists purely to declare the
# render action's own OPTIONAL sibling keys (currently just `gate`) so
# anything that wants to validate/decompile a render action entry has a
# real schema to read — see `grammar.get_render_action_params_schema()`.
# Deliberately NOT merged into SYSTEM_TOKENS / the `action_type` token
# family above — doing so would make `is_known_action_type("render")`
# true and let a kind='cycle' agent's DO list accept a `render` action it
# has no handler for (see `routes/agents.py:_age_validate_action_entries`,
# which is never even called for kind='event' agents in the first place).
event_actions:
  render:
    params_schema:
      # 2026-10-24 (grammar-unification Wave 2) — `render` itself (the
      # renderer-key value, e.g. "error"/"chase_cancel"/"template_attach")
      # is now a declared, required param here, so `render(...)`'s
      # dedicated frontend compiler (`_compileRenderCall`, agents.js) can
      # validate it against this ONE schema the same generic way it
      # already validates `gate`, instead of hand-rolling a separate
      # required-ness check. Free text, never case-normalized (same
      # `freetext` semantics as the condition-kind `log` token's own
      # `tag=` above) — validated server-side against `event_agents.
      # RENDERS`, not against this catalog (see this section's own
      # header comment).
      render:
        type: freetext
        required: true
        description: The renderer key (validated against event_agents.RENDERS
          server-side, not here).
      # `gate` here (action-level) defaults to FALSE and means something
      # unrelated to a notify-channel's own `gate` key above — same name,
      # confirmed-distinct meaning from the real seeded shapes
      # (event_agents.py:SEEDED_AGENTS) and the dispatch code that reads
      # it (`_gate_spec`/`_gate_passes`, event_agents.py:325-337). `true`
      # turns on the shared RepeatGate (keyed by `logger|message`) so
      # repeat-identical fired records collapse into one alert carrying a
      # `repeats` count instead of re-notifying per occurrence. Only
      # ERROR_AGENT sets this `true` today.
      gate:
        type: boolean
        required: false
        description: Enable repeat-dedup (RepeatGate) for this renderer's fired records. Defaults to false (no dedup).

log_tags:
  source:
    table: log_events
    column: tags
    match: contains
  tags:
  - token: orders
    description: 'Order lifecycle records: placed, filled, cancelled, rejected (owner: order routes).'
  - token: chase
    description: 'Chase engine records: cancel-and-replace attempts and outcomes (owner: chase engine).'
  - token: broker
    description: 'Broker connection and API records (owner: broker layer).'
  - token: gtt
    description: 'GTT placement, trigger and status records (owner: order routes).'
  - token: error
    description: 'Error-level records, including repeats (owner: logger).'
  - token: agent
    description: 'Alert agent firings written by the agent engine (owner: agent engine).'
  - token: mcp
    description: 'MCP tool actions: audit pings for cancel, place, modify, and agent status (owner: lab
      routes).'
  - token: deploy
    description: 'Deploy state: branch sync and webhook health (owner: background tasks).'
  - token: summary
    description: 'Open and close market summaries (owner: background tasks).'
  - token: visitor
    description: 'Daily visitor/traffic log report (owner: background tasks).'
  - token: auth
    description: 'Authentication/account-lifecycle records: new user self-registration
      pending admin approval (owner: auth routes).'
  - token: alert
    description: 'Alert-worthy log line, additive to every other tag — surfaces the
      record in /admin/alerts/history alongside real AgentEvent rows (owner: alert
      producers across orders/chase/template-attach/mcp).'
