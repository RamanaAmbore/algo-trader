# Agent grammar — condition / notify / action token catalog.
#
# Phase 1 of the order/agent grammar unification — externalizes
# backend/api/algo/grammar.py's former SYSTEM_TOKENS / LOG_TAG_TOKENS
# Python list literal into this file, matching the convention
# `backend/config/grammars/orders.yaml` already established for the
# frontend CLI grammar (a sibling file, not a shared schema — the two
# grammars are unified in a later phase). This file holds CATALOG
# METADATA ONLY: grammar_kind, token_kind, token, value_type, units,
# description, resolver (a dotted Python import path — a STRING, never
# the function itself), params_schema, template_body, etc.
#
# Resolver FUNCTION BODIES stay exactly where they always were — as
# real Python functions in backend/api/algo/grammar.py / actions.py /
# actions_live.py. Nothing about dispatch changes: GrammarRegistry
# still imports each resolver by dotted path from the grammar_tokens
# DB table at reload() time (grammar_registry.py), same as before this
# file existed.
#
# Loaded at import time by backend/api/algo/grammar.py, which
# reconstructs the exact same SYSTEM_TOKENS / LOG_TAG_TOKENS
# list-of-dicts shape every downstream consumer
# (seed_grammar_tokens(), event_agents.py, tests) already expects.
# Pure data relocation — zero behavior change.
#
# log_tags.source is reused verbatim (as a nested dict) on every
# reconstructed log-tag token entry, matching the original
# _LOG_SOURCE constant in grammar.py.

system_tokens:

# ════════════════════════════════════════════════════════════════════════
#  CONDITION — METRICS (number-producing)
# ════════════════════════════════════════════════════════════════════════
- grammar_kind: condition
  token_kind: metric
  token: pnl
  value_type: number
  units: ₹
  description: Positions mark-to-market P&L in ₹ for the selected scope.
  resolver: backend.api.algo.grammar_tokens.metric_pnl._metric_pnl
- grammar_kind: condition
  token_kind: metric
  token: pnl_pct
  value_type: number
  units: '%'
  description: Positions P&L as percent of used margin. Undefined when no open positions.
  resolver: backend.api.algo.grammar_tokens.metric_pnl_pct._metric_pnl_pct
- grammar_kind: condition
  token_kind: metric
  token: day_val
  value_type: number
  units: ₹
  description: Holdings day-change value in ₹ for the selected scope.
  resolver: backend.api.algo.grammar_tokens.metric_day_val._metric_day_val
- grammar_kind: condition
  token_kind: metric
  token: day_pct
  value_type: number
  units: '%'
  description: Holdings day-change percentage for the selected scope.
  resolver: backend.api.algo.grammar_tokens.metric_day_pct._metric_day_pct
- grammar_kind: condition
  token_kind: metric
  token: inv_val
  value_type: number
  units: ₹
  description: Holdings invested value (cost basis).
  resolver: backend.api.algo.grammar_tokens.metric_inv_val._metric_inv_val
- grammar_kind: condition
  token_kind: metric
  token: cur_val
  value_type: number
  units: ₹
  description: Holdings current market value.
  resolver: backend.api.algo.grammar_tokens.metric_cur_val._metric_cur_val
- grammar_kind: condition
  token_kind: metric
  token: cash
  value_type: number
  units: ₹
  description: Live available cash on the funds row (moves intraday). None when the broker does not report
    this field for the account.
  resolver: backend.api.algo.grammar_tokens.metric_cash._metric_cash
- grammar_kind: condition
  token_kind: metric
  token: sod_cash
  value_type: number
  units: ₹
  description: Start-of-day cash (opening balance) — does not move intraday. None when the broker does
    not report this field for the account.
  resolver: backend.api.algo.grammar_tokens.metric_sod_cash._metric_sod_cash
- grammar_kind: condition
  token_kind: metric
  token: avail_margin
  value_type: number
  units: ₹
  description: Net available margin.
  resolver: backend.api.algo.grammar_tokens.metric_avail_margin._metric_avail_margin
- grammar_kind: condition
  token_kind: metric
  token: used_margin
  value_type: number
  units: ₹
  description: Utilised margin (positions denominator for pnl_pct).
  resolver: backend.api.algo.grammar_tokens.metric_used_margin._metric_used_margin
- grammar_kind: condition
  token_kind: metric
  token: collateral
  value_type: number
  units: ₹
  description: Collateral component of margin.
  resolver: backend.api.algo.grammar_tokens.metric_collateral._metric_collateral

# Rate-of-change metrics (computed over the rolling history held by the engine)
- grammar_kind: condition
  token_kind: metric
  token: pnl_rate_abs
  value_type: number
  units: ₹/min
  description: Positions P&L rate of change in ₹ per minute over the last window.
  resolver: backend.api.algo.grammar._metric_pnl_rate_abs
- grammar_kind: condition
  token_kind: metric
  token: pnl_rate_pct
  value_type: number
  units: '%/min'
  description: Positions P&L rate of change in percent per minute over the last window.
  resolver: backend.api.algo.grammar._metric_pnl_rate_pct
- grammar_kind: condition
  token_kind: metric
  token: day_rate_abs
  value_type: number
  units: ₹/min
  description: Holdings day-change rate of change in ₹ per minute over the last window.
  resolver: backend.api.algo.grammar._metric_day_rate_abs
- grammar_kind: condition
  token_kind: metric
  token: day_rate_pct
  value_type: number
  units: '%/min'
  description: Holdings day-change rate of change in percent per minute over the last window.
  resolver: backend.api.algo.grammar._metric_day_rate_pct

# Phase 24 — Rolling-window statistical metrics. Read the same pnl_history
# buckets the rate metrics use; aggregate the whole slice instead of just
# endpoints. Useful when an operator wants "exit if P&L has been bleeding
# for 30 min" rather than "exit on a single tick crossing a threshold".
# Return None until the window holds ≥2 samples (newly opened sessions
# don't accidentally fire on cold-start).
- grammar_kind: condition
  token_kind: metric
  token: mean_pnl_30m
  value_type: number
  units: ₹
  description: Average positions P&L over the last 30 minutes.
  resolver: backend.api.algo.grammar._metric_mean_pnl_30m
- grammar_kind: condition
  token_kind: metric
  token: mean_pnl_1h
  value_type: number
  units: ₹
  description: Average positions P&L over the last hour.
  resolver: backend.api.algo.grammar._metric_mean_pnl_1h
- grammar_kind: condition
  token_kind: metric
  token: mean_day_30m
  value_type: number
  units: ₹
  description: Average holdings day-change value over the last 30 minutes.
  resolver: backend.api.algo.grammar._metric_mean_day_30m
- grammar_kind: condition
  token_kind: metric
  token: mean_day_1h
  value_type: number
  units: ₹
  description: Average holdings day-change value over the last hour.
  resolver: backend.api.algo.grammar._metric_mean_day_1h
- grammar_kind: condition
  token_kind: metric
  token: max_drawdown_pnl_30m
  value_type: number
  units: ₹
  description: Worst peak-to-trough drop in positions P&L over the last 30 minutes (always ≤ 0).
  resolver: backend.api.algo.grammar._metric_max_drawdown_pnl_30m
- grammar_kind: condition
  token_kind: metric
  token: max_drawdown_pnl_1h
  value_type: number
  units: ₹
  description: Worst peak-to-trough drop in positions P&L over the last hour (always ≤ 0).
  resolver: backend.api.algo.grammar._metric_max_drawdown_pnl_1h
- grammar_kind: condition
  token_kind: metric
  token: max_drawdown_pnl_4h
  value_type: number
  units: ₹
  description: Worst peak-to-trough drop in positions P&L over the last 4 hours (always ≤ 0).
  resolver: backend.api.algo.grammar._metric_max_drawdown_pnl_4h
- grammar_kind: condition
  token_kind: metric
  token: max_drawdown_day_1h
  value_type: number
  units: ₹
  description: Worst peak-to-trough drop in holdings day-change over the last hour (always ≤ 0).
  resolver: backend.api.algo.grammar._metric_max_drawdown_day_1h
- grammar_kind: condition
  token_kind: metric
  token: max_drawdown_pnl_pct_30m
  value_type: number
  units: '%'
  description: Worst peak-to-trough drop in positions P&L percentage over the last 30 minutes (always
    ≤ 0).
  resolver: backend.api.algo.grammar._metric_max_drawdown_pnl_pct_30m
- grammar_kind: condition
  token_kind: metric
  token: max_drawdown_pnl_pct_1h
  value_type: number
  units: '%'
  description: Worst peak-to-trough drop in positions P&L percentage over the last hour (always ≤ 0).
  resolver: backend.api.algo.grammar._metric_max_drawdown_pnl_pct_1h
- grammar_kind: condition
  token_kind: metric
  token: stdev_pnl_30m
  value_type: number
  units: ₹
  description: Standard deviation of positions P&L over the last 30 minutes (volatility proxy).
  resolver: backend.api.algo.grammar._metric_stdev_pnl_30m
- grammar_kind: condition
  token_kind: metric
  token: stdev_pnl_1h
  value_type: number
  units: ₹
  description: Standard deviation of positions P&L over the last hour.
  resolver: backend.api.algo.grammar._metric_stdev_pnl_1h
- grammar_kind: condition
  token_kind: metric
  token: range_pnl_30m
  value_type: number
  units: ₹
  description: max(P&L) − min(P&L) over the last 30 minutes (swing magnitude).
  resolver: backend.api.algo.grammar._metric_range_pnl_30m
- grammar_kind: condition
  token_kind: metric
  token: range_pnl_1h
  value_type: number
  units: ₹
  description: max(P&L) − min(P&L) over the last hour.
  resolver: backend.api.algo.grammar._metric_range_pnl_1h

# Phase 26 (Sprint 2) — parameterized function-call base tokens. Each one
# is a FACTORY: GrammarRegistry calls it (via the call-shape token the
# operator types, e.g. mean_pnl(30)) with the args bound in params_schema
# declaration order, and caches the returned (ctx, row) -> value callable
# under that literal call string forever after. The fixed-window tokens
# above (mean_pnl_30m etc.) are unaffected — kept as permanent one-line
# bindings to these same factories, not replaced or deprecated.
- grammar_kind: condition
  token_kind: metric
  token: mean_pnl
  value_type: number
  units: ₹
  description: Average positions P&L over the last N minutes. Call syntax, e.g. mean_pnl(30).
  resolver: backend.api.algo.grammar._metric_factory_mean_pnl
  params_schema:
    minutes: {type: number}
- grammar_kind: condition
  token_kind: metric
  token: mean_day
  value_type: number
  units: ₹
  description: Average holdings day-change value over the last N minutes. Call syntax, e.g. mean_day(30).
  resolver: backend.api.algo.grammar._metric_factory_mean_day
  params_schema:
    minutes: {type: number}
- grammar_kind: condition
  token_kind: metric
  token: max_drawdown_pnl
  value_type: number
  units: ₹
  description: Worst peak-to-trough drop in positions P&L over the last N minutes (always ≤ 0). Call syntax, e.g. max_drawdown_pnl(30).
  resolver: backend.api.algo.grammar._metric_factory_max_drawdown_pnl
  params_schema:
    minutes: {type: number}
- grammar_kind: condition
  token_kind: metric
  token: max_drawdown_day
  value_type: number
  units: ₹
  description: Worst peak-to-trough drop in holdings day-change over the last N minutes (always ≤ 0). Call syntax, e.g. max_drawdown_day(60).
  resolver: backend.api.algo.grammar._metric_factory_max_drawdown_day
  params_schema:
    minutes: {type: number}
- grammar_kind: condition
  token_kind: metric
  token: max_drawdown_pnl_pct
  value_type: number
  units: '%'
  description: Worst peak-to-trough drop in positions P&L percentage over the last N minutes (always ≤ 0). Call syntax, e.g. max_drawdown_pnl_pct(30).
  resolver: backend.api.algo.grammar._metric_factory_max_drawdown_pnl_pct
  params_schema:
    minutes: {type: number}
- grammar_kind: condition
  token_kind: metric
  token: stdev_pnl
  value_type: number
  units: ₹
  description: Standard deviation of positions P&L over the last N minutes (volatility proxy). Call syntax, e.g. stdev_pnl(30).
  resolver: backend.api.algo.grammar._metric_factory_stdev_pnl
  params_schema:
    minutes: {type: number}
- grammar_kind: condition
  token_kind: metric
  token: range_pnl
  value_type: number
  units: ₹
  description: max(P&L) − min(P&L) over the last N minutes (swing magnitude). Call syntax, e.g. range_pnl(30).
  resolver: backend.api.algo.grammar._metric_factory_range_pnl
  params_schema:
    minutes: {type: number}

# ── Expiry-aware metrics (Item 1 / Phase 25) ─────────────────────
# Parse the tradingsymbol on every call. Returns None for
# non-derivatives (cash equity) → leaf is skipped.
- grammar_kind: condition
  token_kind: metric
  token: days_until_expiry
  value_type: number
  units: days
  description: Days until this position's option/future expires (parses tradingsymbol). None for cash
    equity.
  resolver: backend.api.algo.grammar._metric_days_until_expiry
- grammar_kind: condition
  token_kind: metric
  token: is_itm
  value_type: number
  units: ''
  description: Returns 1.0 when an option is in-the-money at current spot, 0.0 otherwise. Needs ctx.spot_prices.
  resolver: backend.api.algo.grammar._metric_is_itm
- grammar_kind: condition
  token_kind: metric
  token: is_ntm
  value_type: number
  units: ''
  description: Returns 1.0 when an option is within ±1.5%% of spot (near-the-money), 0.0 otherwise. Needs
    ctx.spot_prices.
  resolver: backend.api.algo.grammar._metric_is_ntm
- grammar_kind: condition
  token_kind: metric
  token: is_future
  description: Returns 1.0 for futures contracts, 0.0 for options, None for equity.
  units: binary
  resolver: backend.api.algo.grammar._metric_is_future
- grammar_kind: condition
  token_kind: metric
  token: minutes_since_open
  value_type: number
  units: min
  description: Minutes since the first market segment opened today.
  resolver: backend.api.algo.grammar._metric_minutes_since_open
- grammar_kind: condition
  token_kind: metric
  token: minutes_until_close
  value_type: number
  units: min
  description: Minutes until the nearest market segment close.
  resolver: backend.api.algo.grammar._metric_minutes_until_close

# Market-cycle event tokens (2026-10-22) — condition/metric tokens over
# agent_engine._ae_segment_flags()'s per-segment computed dict, so agents
# can trigger on a state change (e.g. "the instant MCX opens") instead of
# a fixed fire_at_time clock string. 1.0/0.0 booleans follow the
# is_itm/is_ntm convention; minutes_* tokens return None (not a coerced
# 0) when the quantity isn't meaningful right now — see each resolver's
# own docstring in grammar.py.
- grammar_kind: condition
  token_kind: metric
  token: is_mcx_open
  value_type: number
  units: binary
  description: 1.0 when MCX's own trading session is currently open, 0.0 otherwise.
  resolver: backend.api.algo.grammar._metric_is_mcx_open
- grammar_kind: condition
  token_kind: metric
  token: is_nse_open
  value_type: number
  units: binary
  description: 1.0 when NSE's own trading session is currently open, 0.0 otherwise.
  resolver: backend.api.algo.grammar._metric_is_nse_open
- grammar_kind: condition
  token_kind: metric
  token: minutes_since_mcx_open
  value_type: number
  units: min
  description: Minutes since MCX's own session opened today. None while MCX is closed.
  resolver: backend.api.algo.grammar._metric_minutes_since_mcx_open
- grammar_kind: condition
  token_kind: metric
  token: minutes_since_nse_open
  value_type: number
  units: min
  description: Minutes since NSE's own session opened today. None while NSE is closed.
  resolver: backend.api.algo.grammar._metric_minutes_since_nse_open
- grammar_kind: condition
  token_kind: metric
  token: minutes_until_mcx_close
  value_type: number
  units: min
  description: Minutes until MCX's own session closes today. None while MCX is closed.
  resolver: backend.api.algo.grammar._metric_minutes_until_mcx_close
- grammar_kind: condition
  token_kind: metric
  token: minutes_until_nse_close
  value_type: number
  units: min
  description: Minutes until NSE's own session closes today. None while NSE is closed.
  resolver: backend.api.algo.grammar._metric_minutes_until_nse_close
- grammar_kind: condition
  token_kind: metric
  token: minutes_until_mcx_open
  value_type: number
  units: min
  description: Minutes until MCX's own session opens today. 0 once open; None after today's close or on a no-session day.
  resolver: backend.api.algo.grammar._metric_minutes_until_mcx_open
- grammar_kind: condition
  token_kind: metric
  token: minutes_until_nse_open
  value_type: number
  units: min
  description: Minutes until NSE's own session opens today. 0 once open; None after today's close or on a no-session day.
  resolver: backend.api.algo.grammar._metric_minutes_until_nse_open
- grammar_kind: condition
  token_kind: metric
  token: is_past_holiday_refresh
  value_type: number
  units: binary
  description: 1.0 once today's holiday_refresh_time (default 05:30 IST) clock boundary has passed, 0.0 before it.
  resolver: backend.api.algo.grammar._metric_is_past_holiday_refresh
- grammar_kind: condition
  token_kind: metric
  token: is_past_window_open
  value_type: number
  units: binary
  description: 1.0 from today's 08:00 IST window boundary through the rest of the session (including the 23:31-23:59 IST tail, before the overnight window actually closes); 0.0 only during 00:00-07:59 IST.
  resolver: backend.api.algo.grammar._metric_is_past_window_open
- grammar_kind: condition
  token_kind: metric
  token: underlying_market_loss
  value_type: number
  units: ₹
  description: Sum of (day_change_val now − day_change_val at theoretical-baseline capture) across every currently-held leg of this underlying that has a baseline — the underlying's day_change_val change SINCE the theoretical baseline was captured, not its raw day P&L, so this metric shares the same reference point as underlying_theoretical_loss. A leg with no baseline yet does not contribute; None when no leg of this underlying has a baseline. Pairs with underlying_theoretical_loss / underlying_loss_divergence below under the positions.any_underlying scope.
  resolver: backend.api.algo.grammar._metric_underlying_market_loss
- grammar_kind: condition
  token_kind: metric
  token: underlying_theoretical_loss
  value_type: number
  units: ₹
  description: Baseline-reprice theoretical P&L for every currently-held leg of this underlying — implied vol calibrated ONCE this session and held fixed; only spot and time-to-expiry move tick to tick. None until a frozen baseline exists for every leg and a live spot price is available.
  resolver: backend.api.algo.grammar._metric_underlying_theoretical_loss
- grammar_kind: condition
  token_kind: metric
  token: underlying_loss_divergence
  value_type: number
  units: ₹
  description: abs(underlying_theoretical_loss − underlying_market_loss) for this underlying — how far today's real market loss has diverged from what the frozen-vol Greeks/IV-implied move would predict. None when either side is unavailable (never a false 0 divergence).
  resolver: backend.api.algo.grammar._metric_underlying_loss_divergence

# ════════════════════════════════════════════════════════════════════════
#  CONDITION — SCOPES (row selectors)
# ════════════════════════════════════════════════════════════════════════
- grammar_kind: condition
  token_kind: scope
  token: holdings.total
  value_type: object
  description: The single TOTAL row of the holdings summary.
  resolver: backend.api.algo.grammar._scope_holdings_total
- grammar_kind: condition
  token_kind: scope
  token: holdings.any_acct
  value_type: array
  description: Every non-TOTAL account row of the holdings summary (leaf is OR-combined).
  resolver: backend.api.algo.grammar._scope_holdings_any_acct
- grammar_kind: condition
  token_kind: scope
  token: positions.total
  value_type: object
  description: The single TOTAL row of the positions summary.
  resolver: backend.api.algo.grammar._scope_positions_total
- grammar_kind: condition
  token_kind: scope
  token: positions.any_acct
  value_type: array
  description: Every non-TOTAL account row of the positions summary (leaf is OR-combined).
  resolver: backend.api.algo.grammar._scope_positions_any_acct
- grammar_kind: condition
  token_kind: scope
  token: positions.any_underlying
  value_type: array
  description: One row per distinct F&O underlying currently held (grouped from per-symbol position rows; cash-equity/unparseable rows skipped). Leaf is OR-combined per underlying. Pairs with underlying_market_loss / underlying_theoretical_loss / underlying_loss_divergence.
  resolver: backend.api.algo.grammar._scope_positions_any_underlying
- grammar_kind: condition
  token_kind: scope
  token: funds.total
  value_type: object
  description: The single TOTAL row of the funds/margins dataframe.
  resolver: backend.api.algo.grammar._scope_funds_total

# Per-symbol positions expiring today (or already past expiry).
# Reads from ctx.position_rows (the per-symbol list the engine
# already fetched), NOT from the aggregate sum_positions frame.
- grammar_kind: condition
  token_kind: scope
  token: positions.expiring_today
  value_type: array
  description: Per-symbol position rows where the F&O contract is expiring today (≤ 1.5 days). Leaf is
    OR-combined.
  resolver: backend.api.algo.grammar._scope_positions_expiring_today

# Segment-specific expiry scopes — see the equity / commodity
# auto-close agents in agent_engine.py for the operator-facing
# rationale. NFO closes ALL ITM; MCX closes only UNHEDGED ITM
# (CE/PE pairs that net to zero are skipped, mirroring the legacy
# ExpiryEngine grouping logic).
- grammar_kind: condition
  token_kind: scope
  token: positions.expiring_today.nfo
  value_type: array
  description: Per-symbol position rows expiring today on NFO (equity F&O). Leaf is OR-combined.
  resolver: backend.api.algo.grammar._scope_positions_expiring_today_nfo
- grammar_kind: condition
  token_kind: scope
  token: positions.expiring_today.mcx_unhedged
  value_type: array
  description: Per-symbol position rows expiring today on MCX where CE/PE net qty does NOT balance — i.e.
    unhedged. Hedged pairs (net = 0) are skipped because broker settles them against each other. Leaf
    is OR-combined.
  resolver: backend.api.algo.grammar._scope_positions_expiring_today_mcx_unhedged
- grammar_kind: condition
  token_kind: scope
  token: funds.any_acct
  value_type: array
  description: Every non-TOTAL account row of the funds dataframe (leaf is OR-combined).
  resolver: backend.api.algo.grammar._scope_funds_any_acct

# Worst-case scopes — collapse N per-account agents into 1 by selecting
# the single biggest-loser row each tick. Pair with the standard day_pct
# / pnl_pct / pnl metrics. Operator-facing benefit: one agent, one
# threshold, one notification per fire.
- grammar_kind: condition
  token_kind: scope
  token: holdings.worst_acct
  value_type: object
  description: The single account row with the most-negative day_pct in holdings.
  resolver: backend.api.algo.grammar._scope_holdings_worst_acct
- grammar_kind: condition
  token_kind: scope
  token: holdings.worst_symbol
  value_type: object
  description: The single per-symbol holding row with the most-negative day_pct.
  resolver: backend.api.algo.grammar._scope_holdings_worst_symbol
- grammar_kind: condition
  token_kind: scope
  token: positions.worst_acct
  value_type: object
  description: The single account row with the most-negative pnl_pct in positions.
  resolver: backend.api.algo.grammar._scope_positions_worst_acct
- grammar_kind: condition
  token_kind: scope
  token: positions.worst_symbol
  value_type: object
  description: The single per-symbol position row with the most-negative pnl.
  resolver: backend.api.algo.grammar._scope_positions_worst_symbol

# ── Watchlist metric ─────────────────────────────────────────────
- grammar_kind: condition
  token_kind: metric
  token: ltp
  value_type: number
  units: ₹
  description: Last-traded price of a watchlist row (or any row with a last_price column).
  resolver: backend.api.algo.grammar_tokens.metric_ltp._metric_ltp

# ── Watchlist scopes ─────────────────────────────────────────────
- grammar_kind: condition
  token_kind: scope
  token: watchlist.all
  value_type: array
  description: Every row across every watchlist the operator owns (leaf is OR-combined per row).
  resolver: backend.api.algo.grammar._scope_watchlist_all
- grammar_kind: condition
  token_kind: scope
  token: watchlist.default
  value_type: array
  description: Rows in the operator's Default watchlist.
  resolver: backend.api.algo.grammar._scope_watchlist_default
- grammar_kind: condition
  token_kind: scope
  token: watchlist.markets
  value_type: array
  description: Rows in the auto-seeded Markets watchlist (indices + MCX commodities).
  resolver: backend.api.algo.grammar._scope_watchlist_markets

# ── Orders scope (account-rooted) ─────────────────────────────────
- grammar_kind: condition
  token_kind: scope
  token: orders.any_acct
  value_type: array
  description: Every currently open/active order (mode=live, not yet filled/cancelled/rejected), across every
    account. Leaf is OR-combined per row.
  resolver: backend.api.algo.grammar._scope_orders_any_acct

# ── Quote scope (instrument-rooted, pre-tracked) ──────────────────
- grammar_kind: condition
  token_kind: scope
  token: quote.tracked
  value_type: array
  description: Pre-tracked ad-hoc market-data row(s) for symbols referenced by at least one active agent's
    quote.* condition leaf (via scope_filter.symbol), refreshed once per performance cycle — not a live
    per-condition broker fetch. REQUIRES a non-wildcard scope_filter.symbol. Leaf is OR-combined per row.
  resolver: backend.api.algo.grammar._scope_quote_tracked

# ── Symbols scope (Sprint G — unified watchlist/pinned/gainers/losers) ──
- grammar_kind: condition
  token_kind: scope
  token: symbols.all
  value_type: array
  description: Every row across the unified symbols.* kinds (watchlist/pinned/gainers/losers), refreshed once
    per performance cycle. REQUIRES a non-wildcard scope_filter.kind (one of watchlist/pinned/gainers/losers)
    to disambiguate which kind's rows a leaf evaluates over. Leaf is OR-combined per row.
  resolver: backend.api.algo.grammar._scope_symbols_all

# ════════════════════════════════════════════════════════════════════════
#  CONDITION — OPERATORS (leaf comparators)
# ════════════════════════════════════════════════════════════════════════
- grammar_kind: condition
  token_kind: operator
  token: <
  value_type: boolean
  description: Strictly less than.
- grammar_kind: condition
  token_kind: operator
  token: <=
  value_type: boolean
  description: Less than or equal to.
- grammar_kind: condition
  token_kind: operator
  token: '>'
  value_type: boolean
  description: Strictly greater than.
- grammar_kind: condition
  token_kind: operator
  token: '>='
  value_type: boolean
  description: Greater than or equal to.
- grammar_kind: condition
  token_kind: operator
  token: ==
  value_type: boolean
  description: Equal to.
- grammar_kind: condition
  token_kind: operator
  token: '!='
  value_type: boolean
  description: Not equal to.
- grammar_kind: condition
  token_kind: operator
  token: in
  value_type: boolean
  description: Membership test. The RHS must be an array literal.
- grammar_kind: condition
  token_kind: operator
  token: not_in
  value_type: boolean
  description: Non-membership test. The RHS must be an array literal.
- grammar_kind: condition
  token_kind: operator
  token: between
  value_type: boolean
  description: Range test, inclusive. RHS is a [min, max] literal.
# 2026-10-24 (grammar-unification Wave 2) — the kind='event' agent
# CONDITION, dissolved off the old standalone `event_stmt` (`ALERT
# log_tag=...`) into an ordinary bare-call leaf: `log(tag=..., min_level=...,
# where={...})`. Position-resolved, same name as the `(action, action_type,
# log)` token below (the renamed `emit_log`) — in a WHEN condition, `log`
# means this log-stream filter; in an action (preamble/DO) it means the
# app-log action. `token_kind: log_filter` (never `metric`) so it lands in
# its own frontend catalog bucket (`buildCatalog()`'s `logConditions` map),
# never the ordinary metric table — a real metric is always used via
# `metric@scope`, this is a bare call with its own kwarg vocabulary. No
# `GrammarRegistry` loader exists for `(condition, log_filter)` — `_eval_leaf`
# dispatches `"log" in leaf` directly to `agent_evaluator._eval_log`,
# bypassing the registry entirely (confirmed: REGISTRY.metric()/scope()/op()
# are never consulted for a log leaf). The `resolver` path below is
# documentation only (and `help_lookup`'s own `_help_resolve_callable`
# special case), not a live dispatch pointer. See docs/specs/
# AGENTS_GRAMMAR_EBNF.md "Event agents" section and CLAUDE.md's "Unified
# agent DSL" entry.
- grammar_kind: condition
  token_kind: log_filter
  token: log
  value_type: void
  description: Match log records by tag, minimum level, and exact extra-field
    values — the kind='event' agent CONDITION. Compiles to a log-filter leaf
    carrying tag/min_level/where. See the action-kind `log` token for the
    position-resolved app-log ACTION meaning of this same name.
  resolver: backend.api.algo.agent_evaluator._eval_log
  params_schema:
    tag:
      type: freetext
      required: true
      description: Log tag to match (e.g. "error", "orders", "gtt") — bare
        or quoted, preserved exactly as typed, never case-normalized.
    min_level:
      type: enum
      enum:
      - DEBUG
      - INFO
      - WARNING
      - ERROR
      - CRITICAL
      default: INFO
    where:
      type: object
      required: false
      description: Optional exact-match filter against the log record's own
        `extra` fields, e.g. where={alert_event="cancel_unconfirmed"}.

# ════════════════════════════════════════════════════════════════════════
#  NOTIFY — CHANNELS (how the alert is delivered)
# ════════════════════════════════════════════════════════════════════════
# `gate` (Sprint 18) is channel-level, independent of the `gate` key on
# the render action below — same name, unrelated meaning, confirmed from
# real seeded shapes in event_agents.py:SEEDED_AGENTS and the dispatch
# code that actually reads it (`_send_channel`, event_agents.py:345).
# Defaults to `true` (gate active): when active, the channel send is
# skipped unless `_channel_enabled(capability)` (the
# `notifications.<cap>_enabled` DB/YAML capability toggle) passes.
# `gate: false` bypasses that capability check for this channel entry —
# used by seeded agents (order-failure, template-guard, rich-alert, etc.)
# whose channel list must still attempt delivery even when the matching
# capability toggle is off. Deliberately NOT declared on `log` (capability
# is already `None` — `_channel_enabled(None)` is always `True`, so `gate`
# has no effect there) or on `websocket`/`inapp` (not read by
# `event_agents.CHANNELS`/`_send_channel` at all — those are the kind=
# 'cycle' agent-engine's own separate notify path). Schema-only addition —
# the field already worked functionally before this declaration; this
# just lets catalog-driven validators/decompilers recognize it.
- grammar_kind: notify
  token_kind: channel
  token: telegram
  value_type: enum
  description: Telegram group defined by secrets.telegram_chat_id.
  params_schema:
    gate:
      type: boolean
      required: false
      description: Bypass the 'telegram' capability gate when false. Defaults to true (gate active).
# Was never registered as a catalog token at all (distinct from the
# `gate`-schema-only additions above) — event_agents.py's CHANNELS table
# has carried a real, working `telegram_info` sender (_send_telegram_info_html,
# a separate 'info' Telegram key, secrets.telegram_chat_id_info) since
# before this catalog existed; the seeded `market-summary` agent's own
# event entry (`{"channel": "telegram_info", "enabled": true, "gate":
# false}`) could never decompile back to CLI text because the channel
# itself had no catalog row to resolve against — "unknown channel
# 'telegram_info'" (or, once a `gate` key is present, "not declared in
# its catalog schema"). capability=None (same as `log`) — `gate` is a
# structural no-op here (`_channel_enabled(None)` is always True) but is
# still declared, schema-only, so `market-summary`'s stored `gate: false`
# key round-trips instead of failing loud.
- grammar_kind: notify
  token_kind: channel
  token: telegram_info
  value_type: enum
  description: Telegram via the dedicated 'info' key (secrets.telegram_chat_id_info), bypassing the regular 'telegram' capability gate — used by low-noise informational alerts (e.g. market-summary).
  params_schema:
    gate:
      type: boolean
      required: false
      description: Structural no-op (capability is None for this channel) — declared only so a stored 'gate' key decompiles.
# 2026-10 channel-routing fix — dedicated deploy-alerts Telegram
# bot/chat (secrets.telegram_bot_token_deploy / telegram_chat_id_deploy,
# falling back to the general telegram bot/chat when absent — same
# fallback pair webhook/notify_deploy.py's own, separate deploy-OK/FAIL
# pings use). Added so deploy-sync-alert's own 'deploy-sync-alert'
# channel entry (which carries a 'gate' key) resolves against a
# declared schema, same convention as telegram_info above.
- grammar_kind: notify
  token_kind: channel
  token: telegram_deploy
  value_type: enum
  description: Telegram via the dedicated deploy-alerts key (secrets.telegram_bot_token_deploy / telegram_chat_id_deploy), bypassing the regular 'telegram' capability gate — used exclusively by deploy-sync-alert.
  params_schema:
    gate:
      type: boolean
      required: false
      description: Structural no-op (capability is None for this channel) — declared only so a stored 'gate' key decompiles.
- grammar_kind: notify
  token_kind: channel
  token: email
  value_type: enum
  description: Email to every address in secrets.alert_emails.
  params_schema:
    gate:
      type: boolean
      required: false
      description: Bypass the 'mail' capability gate when false. Defaults to true (gate active).
# ntfy already dispatches today (events.py's _RECORDED_CHANNELS /
# event_agents.py's CHANNELS table) — this entry is Sprint 6's catalog
# registration only, so the agent CLI grammar's autocomplete/validation
# surfaces it as an authorable channel token like every other one here.
- grammar_kind: notify
  token_kind: channel
  token: ntfy
  value_type: enum
  description: Push notification via ntfy.sh. Priority sets urgency; defaults to the firing agent's tier when omitted.
  params_schema:
    priority:
      type: enum
      enum:
      - low
      - default
      - high
      - urgent
      required: false
    gate:
      type: boolean
      required: false
      description: Bypass the 'ntfy' capability gate when false. Defaults to true (gate active).
- grammar_kind: notify
  token_kind: channel
  token: websocket
  value_type: enum
  description: Live push to connected /algo dashboard clients.
- grammar_kind: notify
  token_kind: channel
  token: log
  value_type: enum
  description: Write to the app log only — useful for silent testing of new agents.

# In-app rich popup channel. Distinct from `websocket` (which is the
# raw live-data feed every algo page subscribes to). `inapp` is
# operator-facing: it raises a toast top-right and bumps the
# AgentNotifications bell badge so the fire interrupts attention
# exactly the way an order-ticket popup does. Surface is the
# AgentFireModal in the frontend — pair this channel with the
# other channels (telegram, email, log) on the loss / expiry
# agents so a Telegram-muted operator still sees the popup in
# the browser tab.
- grammar_kind: notify
  token_kind: channel
  token: inapp
  value_type: enum
  description: In-app rich popup + toast for the AgentNotifications bell. Same delivery surface as the
    order-ticket modal.

