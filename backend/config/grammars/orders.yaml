# Order-entry command grammar.
#
# Language-agnostic schema (loadable from Python AND JavaScript).
# Suggester / resolver hooks are referenced by name ("kind: symbol") and
# implemented separately in each runtime.
#
# Token flow for buy/sell:
#   account → instType → symbol(3+ chars) → strike(CALL/PUT) → expiry(non-EQ)
#   → qty → orderType → price(non-MARKET) → chase(non-MARKET)
#
# The resolved Kite tradingsymbol is shown in brackets at the end as a preview.
#
# ── Shared field catalog (Phase 2 of order/agent grammar unification) ──
# This file is a SYMLINK (frontend/src/lib/command/grammars/orders.yaml →
# this file) loaded client-side ONLY, via a Vite `?raw` import + a single
# js-yaml parse (frontend/src/lib/command/grammars/orders.js). There is no
# Python reader of this file and no cross-file YAML include mechanism
# available to a `?raw` import, so the `qty` / `orderType` / `price` /
# `chase` tokens and the `product` kwarg below stay fully self-contained —
# their `values:` lists cannot literally reference
# backend/config/grammars/order_fields.yaml the way place_order's
# params_schema does. Each is annotated below with an inert `# catalog:`
# comment (ignored by both js-yaml and PyYAML) naming the corresponding
# order_fields.yaml entry; backend/tests/test_order_fields_catalog.py
# drift-guards that the two never silently diverge. A real single load
# would require a follow-up change to orders.js itself (out of scope —
# frontend logic explicitly untouched this phase).

verbs:
  buy:
    description: "Place a buy order"
    tokens:
      - role: account
        kind: account
        required: true
      - role: instType
        values: [CALL, PUT, FUT, EQ]
        required: false
        parse: upper
        hint: "CALL | PUT | FUT | EQ (default: EQ)"
      - role: symbol
        kind: symbol
        required: true
        hint: "underlying — type 3+ chars"
      - role: strike
        kind: strike
        required: "if:instType==CALL|PUT"
        parse: float
        hint: "strike price (* = wide spread)"
      - role: expiry
        kind: expiry
        required: "if:instType==CALL|PUT|FUT"
        hint: "expiry date"
      - role: qty                         # catalog: order_fields.qty
        kind: qty
        required: true
        parse: int
        hint: "quantity (lots × lot_size for F&O)"
      - role: orderType                   # catalog: order_fields.order_type
        values: [LIMIT, SL, SL-M, MARKET]
        required: true
        parse: upper
        hint: "LIMIT | SL | SL-M | MARKET"
      - role: price                       # catalog: order_fields.price (+ trigger_price, split in buildOrderPayload)
        kind: price
        required: "if:orderType!=MARKET"
        parse: float
        hint: "limit/trigger price"
      - role: chase                       # catalog: order_fields.chase_level
        values: [LOW, MED, HIGH]
        required: false
        parse: upper
        hint: "chase aggressiveness (non-MARKET only)"
    kwargs:
      product:                            # catalog: order_fields.product
        values: [MIS, NRML, CNC]

  sell:
    description: "Place a sell order"
    tokens:
      - role: account
        kind: account
        required: true
      - role: instType
        values: [CALL, PUT, FUT, EQ]
        required: false
        parse: upper
        hint: "CALL | PUT | FUT | EQ (default: EQ)"
      - role: symbol
        kind: symbol
        required: true
        hint: "underlying — type 3+ chars"
      - role: strike
        kind: strike
        required: "if:instType==CALL|PUT"
        parse: float
        hint: "strike price (* = wide spread)"
      - role: expiry
        kind: expiry
        required: "if:instType==CALL|PUT|FUT"
        hint: "expiry date"
      - role: qty                         # catalog: order_fields.qty
        kind: qty
        required: true
        parse: int
        hint: "quantity (lots × lot_size for F&O)"
      - role: orderType                   # catalog: order_fields.order_type
        values: [LIMIT, SL, SL-M, MARKET]
        required: true
        parse: upper
        hint: "LIMIT | SL | SL-M | MARKET"
      - role: price                       # catalog: order_fields.price (+ trigger_price, split in buildOrderPayload)
        kind: price
        required: "if:orderType!=MARKET"
        parse: float
        hint: "limit/trigger price"
      - role: chase                       # catalog: order_fields.chase_level
        values: [LOW, MED, HIGH]
        required: false
        parse: upper
        hint: "chase aggressiveness (non-MARKET only)"
    kwargs:
      product:                            # catalog: order_fields.product
        values: [MIS, NRML, CNC]

  cancel:
    description: "Cancel an open order"
    tokens:
      - role: order_id
        kind: order_id
        required: true

  modify:
    description: "Modify an open order"
    tokens:
      - role: order_id
        kind: order_id
        required: true
    kwargs:
      price:                              # catalog: order_fields.price
        parse: float
      qty:                                # catalog: order_fields.qty
        parse: int
      chase:                              # catalog: order_fields.chase_level
        values: [LOW, MED, HIGH]
        parse: upper

# Chase level → engine config. NOTE: this is the CLI's own band_ticks/
# retry_seconds table — a DIFFERENT, unrelated chase config from the live
# agent chase engine's `_live_chase_config()` interval_seconds/aggression_
# step/max_attempts tiers (same LOW/MED/HIGH naming convention, different
# mechanics — see order_fields.yaml's `chase_levels_cli_reference` for the
# mirrored copy + the drift-guard test that keeps the two byte-identical).
chase_levels:
  LOW:  { band_ticks: 8, retry_seconds: 60 }
  MED:  { band_ticks: 4, retry_seconds: 30 }
  HIGH: { band_ticks: 1, retry_seconds: 10 }
