# Order-entry command grammar.
#
# Language-agnostic schema (loadable from Python AND JavaScript).
# Suggester / resolver hooks are referenced by name ("kind: symbol") and
# implemented separately in each runtime.
#
# Token flow for buy/sell:
#   account → instType → symbol(3+ chars) → strike(CALL/PUT) → expiry(non-EQ)
#   → qty → orderType → price(non-MARKET) → chase(non-MARKET)
#
# The resolved Kite tradingsymbol is shown in brackets at the end as a preview.
#
# ── Shared field catalog (Phase 2+4 of order/agent grammar unification) ──
# This file is a SYMLINK (frontend/src/lib/command/grammars/orders.yaml →
# this file) loaded client-side ONLY, via a Vite `?raw` import + a single
# js-yaml parse (frontend/src/lib/command/grammars/orders.js). There is no
# Python reader of this file.
#
# Phase 4 added a second SYMLINK + `?raw` import, for
# backend/config/grammars/order_fields.yaml (the shared catalog), and a
# genuine JS-side `$ref` resolver in orders.js — mirroring (in spirit, not
# code) backend/api/algo/grammar.py's `_resolve_param_spec()`. The `qty` /
# `orderType` / `price` / `chase` tokens below and the `product` kwarg
# carry a `$ref: <key>` marker (first key under each spec, matching
# agent_grammar.yaml's convention) pointing at the corresponding
# order_fields.yaml entry.
#
# The local `values:` lists are DELIBERATELY KEPT alongside `$ref` rather
# than removed — `order_type` and `product`'s catalog enum ORDER differs
# from this file's CLI display order (see order_fields.yaml's header,
# "Enum VALUE ORDER is preserved independently per layer"), and the CLI's
# own order drives the CommandBar suggester's popup order; replacing it
# with the catalog's order would be a real behavior change. orders.js's
# resolver therefore treats the catalog as authoritative for MEMBERSHIP
# only: when a spec has both `$ref` and local `values`, it asserts
# set-equality and throws a loud error if they ever diverge, but always
# emits the local `values` (preserving this file's own order) when they
# agree. A spec with `$ref` and no local `values` (none exist today, but
# future additions may) is populated straight from the catalog's `enum`.
# backend/tests/test_order_fields_catalog.py's drift-guard tests still
# apply as an independent (Python-side) cross-check of the same invariant.

verbs:
  buy:
    description: "Place a buy order"
    tokens:
      - role: account
        kind: account
        required: true
      - role: instType
        values: [CALL, PUT, FUT, EQ]
        required: false
        parse: upper
        hint: "CALL | PUT | FUT | EQ (default: EQ)"
      - role: symbol
        kind: symbol
        required: true
        hint: "underlying — type 3+ chars"
      - role: strike
        kind: strike
        required: "if:instType==CALL|PUT"
        parse: float
        hint: "strike price (* = wide spread)"
      - role: expiry
        kind: expiry
        required: "if:instType==CALL|PUT|FUT"
        hint: "expiry date"
      - role: qty
        $ref: qty
        kind: qty
        required: true
        parse: int
        hint: "quantity (lots × lot_size for F&O)"
      - role: orderType
        $ref: order_type
        values: [LIMIT, SL, SL-M, MARKET]
        required: true
        parse: upper
        hint: "LIMIT | SL | SL-M | MARKET"
      - role: price                       # (+ trigger_price, split in buildOrderPayload)
        $ref: price
        kind: price
        required: "if:orderType!=MARKET"
        parse: float
        hint: "limit/trigger price"
      - role: chase
        $ref: chase_level
        values: [LOW, MED, HIGH]
        required: false
        parse: upper
        hint: "chase aggressiveness (non-MARKET only)"
    kwargs:
      product:
        $ref: product
        values: [MIS, NRML, CNC]

  sell:
    description: "Place a sell order"
    tokens:
      - role: account
        kind: account
        required: true
      - role: instType
        values: [CALL, PUT, FUT, EQ]
        required: false
        parse: upper
        hint: "CALL | PUT | FUT | EQ (default: EQ)"
      - role: symbol
        kind: symbol
        required: true
        hint: "underlying — type 3+ chars"
      - role: strike
        kind: strike
        required: "if:instType==CALL|PUT"
        parse: float
        hint: "strike price (* = wide spread)"
      - role: expiry
        kind: expiry
        required: "if:instType==CALL|PUT|FUT"
        hint: "expiry date"
      - role: qty
        $ref: qty
        kind: qty
        required: true
        parse: int
        hint: "quantity (lots × lot_size for F&O)"
      - role: orderType
        $ref: order_type
        values: [LIMIT, SL, SL-M, MARKET]
        required: true
        parse: upper
        hint: "LIMIT | SL | SL-M | MARKET"
      - role: price                       # (+ trigger_price, split in buildOrderPayload)
        $ref: price
        kind: price
        required: "if:orderType!=MARKET"
        parse: float
        hint: "limit/trigger price"
      - role: chase
        $ref: chase_level
        values: [LOW, MED, HIGH]
        required: false
        parse: upper
        hint: "chase aggressiveness (non-MARKET only)"
    kwargs:
      product:
        $ref: product
        values: [MIS, NRML, CNC]

  cancel:
    description: "Cancel an open order"
    tokens:
      - role: order_id
        kind: order_id
        required: true

  modify:
    description: "Modify an open order"
    tokens:
      - role: order_id
        kind: order_id
        required: true
    kwargs:
      price:
        $ref: price
        parse: float
      qty:
        $ref: qty
        parse: int
      chase:
        $ref: chase_level
        values: [LOW, MED, HIGH]
        parse: upper

# Chase level → engine config. NOTE: this is the CLI's own band_ticks/
# retry_seconds table — a DIFFERENT, unrelated chase config from the live
# agent chase engine's `_live_chase_config()` interval_seconds/aggression_
# step/max_attempts tiers (same LOW/MED/HIGH naming convention, different
# mechanics — see order_fields.yaml's `chase_levels_cli_reference` for the
# mirrored copy + the drift-guard test that keeps the two byte-identical).
chase_levels:
  LOW:  { band_ticks: 8, retry_seconds: 60 }
  MED:  { band_ticks: 4, retry_seconds: 30 }
  HIGH: { band_ticks: 1, retry_seconds: 10 }
